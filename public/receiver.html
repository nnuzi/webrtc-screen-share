<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<title data-i18n="receiver.title"></title>
</head>
<body class="m-0 bg-black flex justify-center items-center h-screen font-sans overflow-hidden">
    <div id="overlay" class="fixed inset-0 flex flex-col justify-center items-center bg-[#1a1a1a] text-white z-10 transition-opacity duration-300">
        <div class="w-9 h-9 border-4 border-white/20 border-t-white rounded-full animate-spin mb-4"></div>
        <div id="statusMsg" data-i18n="receiver.connecting"></div>
        <div id="overlayHint" class="text-white/50 text-xs mt-2" data-i18n="receiver.hint"></div>
    </div>
    <video id="remoteVideo" class="w-full h-full object-contain" autoplay playsinline muted></video>
    <script src="/socket.io/socket.io.js"></script>
    <script src="WebRTCManager.js"></script>
    <script type="module">
        import { getLang, loadLang, t, applyI18n } from './i18n.js';

        await loadLang(getLang());
        applyI18n();

        const WEBRTC_CONFIG = { bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require', iceCandidatePoolSize: 10 };
        const overlay = document.getElementById('overlay');
        const statusMsg = document.getElementById('statusMsg');
        const hint = document.getElementById('overlayHint');
        const remoteVideo = document.getElementById('remoteVideo');
        remoteVideo.playoutDelayHint = 0;

        const room = new URLSearchParams(location.search).get('room');
        if (!room) {
            statusMsg.textContent = t('receiver.missingRoom');
            hint.textContent = '';
            throw new Error('Missing room query parameter');
        }

        const socket = io(undefined, { query: { room } });
        const manager = new WebRTCManager(WEBRTC_CONFIG);

        function showOverlay(msg, subtext) {
            overlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            statusMsg.textContent = msg;
            hint.textContent = subtext || '';
        }

        function hideOverlay() {
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        socket.on('connect_error', (err) => {
            showOverlay(t('receiver.connectServerFailed') + ': ' + (err.message || ''), t('receiver.checkNetwork'));
        });

        socket.on('connect', () => {
            statusMsg.textContent = t('receiver.waitingSender');
            socket.emit('ready');
        });

        manager.addEventListener('track', (e) => {
            remoteVideo.srcObject = e.detail;
        });

        manager.addEventListener('icecandidate', (e) => socket.emit('candidate', e.detail));
        socket.on('candidate', (c) => manager.addRemoteCandidate(c));

        manager.addEventListener('statechange', (e) => {
            const state = e.detail;
            if (state === 'connected' && remoteVideo.srcObject) {
                hideOverlay();
            } else if (state === 'disconnected') {
                showOverlay(t('receiver.disconnected'));
            } else if (state === 'failed') {
                showOverlay(t('receiver.connectionFailed'));
            } else if (state === 'closed') {
                showOverlay(t('receiver.connectionClosed'));
            }
        });

        socket.on('disconnect', () => {
            showOverlay(t('receiver.serverDisconnected'));
        });

        socket.on('peer-disconnected', () => {
            showOverlay(t('receiver.senderLeft'), t('receiver.senderLeftHint'));
            if (manager) manager.close();
        });

        socket.on('offer', async (offer) => {
            statusMsg.textContent = t('receiver.connecting');
            try {
                await manager.setRemote(offer);
                const answer = await manager.pc.createAnswer();
                await manager.pc.setLocalDescription(answer);
                socket.emit('answer', answer);
            } catch (err) {
                showOverlay(t('receiver.offerFailed') + ': ' + (err.message || ''), t('receiver.offerHint'));
            }
        });

        document.body.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.body.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
