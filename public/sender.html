<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<title>屏幕共享 · 发送端</title>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100 font-sans">
    <div class="bg-white p-10 rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.08)] text-center max-w-sm w-full">
        <div id="landing">
            <h2 class="mb-6 text-gray-900 font-semibold text-xl">屏幕共享</h2>
            <button id="createBtn" class="w-full py-3 rounded-lg text-base cursor-pointer font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-opacity duration-200 bg-blue-500 text-white hover:opacity-80">创建共享房间</button>
        </div>

        <div id="sharing" class="hidden">
            <h2 class="mb-6 text-gray-900 font-semibold text-xl">屏幕共享</h2>
            <div class="text-gray-400 text-[13px] mb-1">房间号</div>
            <div class="text-4xl font-bold tracking-[6px] text-gray-900 my-3 mb-2 tabular-nums" id="roomCode"></div>
            <div class="text-gray-400 text-[13px] mb-1 mt-3">扫描二维码加入</div>
            <div class="mx-auto my-4 w-[200px] h-[200px] flex justify-center items-center bg-gray-50 rounded-xl p-2 border border-gray-200" id="qrcode"></div>
            <div class="text-blue-500 break-all text-xs leading-5 mb-5 select-all" id="receiverLink"></div>
            <div class="h-px bg-gray-200 my-5"></div>
            <button id="shareBtn" class="w-full py-3 rounded-lg text-base cursor-pointer font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-opacity duration-200 bg-green-500 text-white hover:opacity-80" disabled>等待接收端加入...</button>
            <button id="stopBtn" class="w-full py-3 rounded-lg text-base cursor-pointer font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-opacity duration-200 bg-red-500 text-white hover:opacity-80 mt-2">停止共享</button>
            <div class="mt-4 text-sm min-h-[20px]" id="statusText"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="WebRTCManager.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const $landing = $('landing');
        const $sharing = $('sharing');
        const $createBtn = $('createBtn');
        const $roomCode = $('roomCode');
        const $qrcode = $('qrcode');
        const $receiverLink = $('receiverLink');
        const $shareBtn = $('shareBtn');
        const $stopBtn = $('stopBtn');
        const $status = $('statusText');

        const STATUS_BASE = 'mt-4 text-sm min-h-[20px]';
        const BTN_GREEN = 'w-full py-3 rounded-lg text-base cursor-pointer font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-opacity duration-200 bg-green-500 text-white hover:opacity-80';
        const BTN_BLUE = 'w-full py-3 rounded-lg text-base cursor-pointer font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-opacity duration-200 bg-blue-500 text-white hover:opacity-80';

        let socket, manager, room, isSharing;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        const WEBRTC_CONFIG = { bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require', iceCandidatePoolSize: 10 };
        const MAX_RECONNECT_ATTEMPTS = 3;
        const RECONNECT_DEBOUNCE_MS = 3000;

        function setupManagerListeners(mgr) {
            mgr.addEventListener('icecandidate', (e) => {
                if (socket) socket.emit('candidate', e.detail);
            });
            mgr.addEventListener('statechange', (e) => {
                handleConnectionState(e.detail);
            });
        }

        function handleConnectionState(state) {
            if (state === 'connected') {
                reconnectAttempts = 0;
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                if (isSharing) {
                    $status.textContent = '共享中...';
                    $status.className = STATUS_BASE;
                }
            } else if (state === 'disconnected') {
                if (isSharing && !reconnectTimer) {
                    $status.textContent = '连接中断，正在重连...';
                    $status.className = STATUS_BASE;
                    reconnectTimer = setTimeout(() => attemptReconnect(), RECONNECT_DEBOUNCE_MS);
                }
            } else if (state === 'failed') {
                if (isSharing && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    attemptReconnect();
                } else if (!isSharing) {
                    $status.textContent = '连接失败，请刷新重试';
                    $status.className = STATUS_BASE + ' text-red-500';
                } else {
                    $status.textContent = '重连失败，请刷新重试';
                    $status.className = STATUS_BASE + ' text-red-500';
                }
            }
        }

        async function attemptReconnect() {
            reconnectAttempts++;
            reconnectTimer = null;
            $status.textContent = `正在重连 (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`;
            $status.className = STATUS_BASE;
            try {
                const oldManager = manager;
                manager = new WebRTCManager(WEBRTC_CONFIG);
                setupManagerListeners(manager);

                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 2560, max: 2560 }, height: { ideal: 1440, max: 1440 }, frameRate: { ideal: 60, max: 60 } },
                    audio: false
                });
                const videoTrack = stream.getVideoTracks()[0];
                videoTrack.onended = () => stopSharing();
                setVideoTrackContentHints(stream, 'motion');
                manager.pc.addTrack(videoTrack, stream);
                setVideoCodecs(manager.pc, ['video/H264']);

                const offer = await manager.restartIce();
                const sdp = offer.sdp.replace(/a=fmtp:(\d+) ([^\r\n]*)/g, (match, pt, params) => {
                    if (offer.sdp.includes(`a=rtpmap:${pt} H264`) && !params.includes('x-google-flag')) {
                        return `a=fmtp:${pt} ${params};x-google-flag=1`;
                    }
                    return match;
                });
                offer.sdp = sdp;
                await manager.setLocal(offer);

                const sender = manager.getSenders()[0];
                const params = sender.getParameters();
                if (params.encodings?.length) {
                    params.encodings[0].maxBitrate = 20_000_000;
                    params.encodings[0].maxFramerate = 60;
                    params.degradationPreference = 'maintain-framerate';
                    await sender.setParameters(params);
                }

                socket.emit('offer', offer);

                if (oldManager) oldManager.close();
                $status.textContent = '已重连成功';
                $status.className = STATUS_BASE + ' text-green-500';
            } catch (err) {
                console.error('Reconnect failed:', err);
                if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                    $status.textContent = '重连失败，请刷新重试';
                    $status.className = STATUS_BASE + ' text-red-500';
                }
            }
        }

        $createBtn.onclick = async () => {
            $createBtn.disabled = true;
            $createBtn.textContent = '正在创建...';

            try {
                if (typeof navigator.mediaDevices?.getDisplayMedia !== 'function') {
                    throw new Error('当前浏览器不支持屏幕共享，请使用 Chrome/Firefox/Edge，并通过 http://localhost:3000 访问');
                }

                room = Math.random().toString(36).substring(2, 8).toLowerCase();

                $landing.classList.add('hidden');
                $sharing.classList.remove('hidden');
                $roomCode.textContent = room;

                const receiverUrl = `${location.origin}/receiver.html?room=${room}`;
                $receiverLink.textContent = receiverUrl;

                const img = new Image();
                img.onerror = () => {
                    img.remove();
                    $qrcode.innerHTML = '<div class="text-gray-400 text-sm">二维码加载失败，请手动复制链接</div>';
                };
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(receiverUrl)}`;
                img.alt = 'QR Code';
                $qrcode.innerHTML = '';
                $qrcode.appendChild(img);

                socket = io(undefined, { query: { room } });

                socket.on('connect_error', (err) => {
                    $status.className = STATUS_BASE + ' text-red-500';
                    $status.textContent = '连接服务器失败: ' + (err.message || '未知错误');
                });

                socket.on('disconnect', (reason) => {
                    if (reason === 'io server disconnect' || reason === 'transport close') {
                        $status.className = STATUS_BASE + ' text-red-500';
                        $status.textContent = '与服务器断开连接';
                    }
                });

                manager = new WebRTCManager(WEBRTC_CONFIG);
                setupManagerListeners(manager);

                socket.on('candidate', (c) => manager.addRemoteCandidate(c));
                socket.on('answer', (a) => {
                    manager.setRemote(a);
                    $status.textContent = '共享中...';
                    $status.className = STATUS_BASE;
                });

                socket.on('receiver-ready', () => {
                    $shareBtn.disabled = false;
                    $shareBtn.className = BTN_GREEN;
                    $shareBtn.textContent = '开始屏幕共享';
                    $status.textContent = '接收端已加入，点击开始共享';
                    $status.className = STATUS_BASE + ' text-green-500';
                });

                $stopBtn.textContent = '退出房间';
                $status.textContent = '等待接收端扫码加入...';
                $status.className = STATUS_BASE;
            } catch (err) {
                console.error(err);
                $status.className = STATUS_BASE + ' text-red-500';
                $status.textContent = err.message || '创建失败';
                setTimeout(cleanup, 5000);
            }
        };

        $shareBtn.onclick = async () => {
            $shareBtn.disabled = true;
            $shareBtn.textContent = '正在共享...';

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 2560, max: 2560 },
                        height: { ideal: 1440, max: 1440 },
                        frameRate: { ideal: 60, max: 60 }
                    },
                    audio: false
                });

                const videoTrack = stream.getVideoTracks()[0];
                setVideoTrackContentHints(stream, 'motion');
                manager.pc.addTrack(videoTrack, stream);
                setVideoCodecs(manager.pc, ['video/H264']);

                const offer = await manager.pc.createOffer();
                const sdp = offer.sdp.replace(/a=fmtp:(\d+) ([^\r\n]*)/g, (match, pt, params) => {
                    if (offer.sdp.includes(`a=rtpmap:${pt} H264`) && !params.includes('x-google-flag')) {
                        return `a=fmtp:${pt} ${params};x-google-flag=1`;
                    }
                    return match;
                });
                offer.sdp = sdp;
                await manager.pc.setLocalDescription(offer);

                const sender = manager.pc.getSenders()[0];
                const params = sender.getParameters();
                if (params.encodings?.length) {
                    params.encodings[0].maxBitrate = 20_000_000;
                    params.encodings[0].maxFramerate = 60;
                    params.degradationPreference = 'maintain-framerate';
                    await sender.setParameters(params);
                }

                socket.emit('offer', offer);

                isSharing = true;
                reconnectAttempts = 0;
                $stopBtn.textContent = '停止共享';
                $shareBtn.textContent = '共享中';
                $status.textContent = '等待接收端连接...';
                $status.className = STATUS_BASE;

                videoTrack.onended = () => {
                    if (isSharing) stopSharing();
                };
            } catch (err) {
                console.error(err);
                $shareBtn.disabled = false;
                $shareBtn.textContent = '开始屏幕共享';
                $status.className = STATUS_BASE + ' text-red-500';
                $status.textContent = err.message || '共享启动失败';
            }
        };

        $stopBtn.onclick = () => {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            if (isSharing) {
                stopSharing();
            } else {
                cleanup();
            }
        };

        function stopSharing() {
            isSharing = false;
            reconnectAttempts = 0;
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            if (manager) {
                manager.close();
                manager = null;
            }
            manager = new WebRTCManager(WEBRTC_CONFIG);
            setupManagerListeners(manager);

            $stopBtn.textContent = '退出房间';
            $shareBtn.disabled = false;
            $shareBtn.className = BTN_GREEN;
            $shareBtn.textContent = '开始屏幕共享';
            $status.className = STATUS_BASE;
            $status.textContent = '已停止共享，可重新开始';
        }

        function cleanup() {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            if (manager) {
                manager.close();
                manager = null;
            }
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            isSharing = false;
            reconnectAttempts = 0;
            $landing.classList.remove('hidden');
            $sharing.classList.add('hidden');
            $qrcode.innerHTML = '';
            $status.className = STATUS_BASE;
            $status.textContent = '';
            $shareBtn.disabled = true;
            $shareBtn.className = BTN_GREEN;
            $shareBtn.textContent = '等待接收端加入...';
            $createBtn.disabled = false;
            $createBtn.className = BTN_BLUE;
            $createBtn.textContent = '创建共享房间';
        }

        function setVideoTrackContentHints(stream, hint) {
            stream.getVideoTracks().forEach((track) => {
                if ('contentHint' in track) {
                    track.contentHint = hint;
                }
            });
        }

        function setVideoCodecs(pc, codecs) {
            const caps = RTCRtpSender.getCapabilities('video');
            if (!caps) return;
            const filtered = caps.codecs.filter(c => codecs.includes(c.mimeType));
            if (filtered.length === 0) return;
            pc.getTransceivers().forEach(t => t.setCodecPreferences(filtered));
        }
    </script>
</body>
</html>
