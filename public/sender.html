<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>屏幕共享 · 发送端</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
    .container { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 100%; }
    h2 { margin-bottom: 24px; color: #1a1a1a; font-weight: 600; }
    .field { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; font-weight: 500; }
    input { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color .2s; }
    input:focus { outline: none; border-color: #007aff; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 500; transition: opacity .2s; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-success { background: #34c759; color: #fff; }
    .btn-success:hover:not(:disabled) { opacity: .85; }
    .btn-danger { background: #ff3b30; color: #fff; }
    .btn-danger:hover:not(:disabled) { opacity: .85; }
    .room-code { font-size: 36px; font-weight: 700; letter-spacing: 6px; color: #1a1a1a; margin: 12px 0 8px; font-variant-numeric: tabular-nums; }
    .label-hint { color: #888; font-size: 13px; margin-bottom: 4px; }
    .qrcode { margin: 16px auto; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; background: #fafafa; border-radius: 12px; padding: 8px; border: 1px solid #eee; }
    .qrcode img { width: 184px; height: 184px; }
    .receiver-link { color: #007aff; word-break: break-all; font-size: 12px; line-height: 1.5; margin-bottom: 20px; user-select: all; }
    .status { margin-top: 16px; color: #888; font-size: 14px; min-height: 20px; }
    .status.error { color: #ff3b30; }
    .status.success { color: #34c759; }
    .hidden { display: none; }
    .divider { height: 1px; background: #eee; margin: 20px 0; }
</style>
</head>
<body>
    <div class="container">
        <div id="landing">
            <h2>屏幕共享</h2>
            <div class="field">
                <label for="serverAddr">服务器地址</label>
                <input id="serverAddr" type="text" readonly tabindex="-1">
                <div style="color:#999; font-size:12px; margin-top:4px;">接收端扫码时使用此地址连接</div>
            </div>
            <button id="createBtn" class="btn-primary">创建共享房间</button>
        </div>

        <div id="sharing" class="hidden">
            <h2>屏幕共享</h2>
            <div class="label-hint">房间号</div>
            <div class="room-code" id="roomCode"></div>
            <div class="label-hint" style="margin-top:12px;">扫描二维码加入</div>
            <div class="qrcode" id="qrcode"></div>
            <div class="receiver-link" id="receiverLink"></div>
            <div class="divider"></div>
            <button id="shareBtn" class="btn-success" disabled>等待接收端加入...</button>
            <button id="stopBtn" class="btn-danger" style="margin-top:8px;">停止共享</button>
            <div class="status" id="statusText"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="WebRTCManager.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const $landing = $('landing');
        const $sharing = $('sharing');
        const $serverAddr = $('serverAddr');
        const $createBtn = $('createBtn');
        const $roomCode = $('roomCode');
        const $qrcode = $('qrcode');
        const $receiverLink = $('receiverLink');
        const $shareBtn = $('shareBtn');
        const $stopBtn = $('stopBtn');
        const $status = $('statusText');

        let socket, manager, room, isSharing;
        let serverProto = 'http';

        fetch('/api/server-info').then(r => r.json()).then(info => {
            $serverAddr.value = `${info.ip}:${info.port}`;
            if (info.protocol) serverProto = info.protocol;
        }).catch(() => {
            $serverAddr.value = location.host;
        });

        $createBtn.onclick = async () => {
            $createBtn.disabled = true;
            $createBtn.textContent = '正在创建...';

            try {
                if (typeof navigator.mediaDevices?.getDisplayMedia !== 'function') {
                    throw new Error('当前浏览器不支持屏幕共享，请使用 Chrome/Firefox/Edge，并通过 http://localhost:3000 访问');
                }

                room = Math.random().toString(36).substring(2, 8).toLowerCase();
                const serverAddr = $serverAddr.value.trim() || location.host;

                $landing.classList.add('hidden');
                $sharing.classList.remove('hidden');
                $roomCode.textContent = room;

                const receiverUrl = `${serverProto}://${serverAddr}/receiver.html?room=${room}`;
                $receiverLink.textContent = receiverUrl;

                const img = new Image();
                img.onerror = () => { img.remove(); };
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(receiverUrl)}`;
                img.alt = 'QR Code';
                $qrcode.innerHTML = '';
                $qrcode.appendChild(img);

                socket = io(undefined, { query: { room } });
                manager = new WebRTCManager();

                manager.addEventListener('icecandidate', (e) => socket.emit('candidate', e.detail));
                socket.on('candidate', (c) => manager.addRemoteCandidate(c));
                socket.on('answer', (a) => {
                    manager.setRemote(a);
                    $status.textContent = '共享中...';
                    $status.className = 'status';
                });

                manager.addEventListener('statechange', (e) => {
                    const s = e.detail;
                    if (s === 'failed') {
                        $status.textContent = '连接失败，请刷新重试';
                        $status.className = 'status error';
                    }
                });

                socket.on('receiver-ready', () => {
                    $shareBtn.disabled = false;
                    $shareBtn.className = 'btn-success';
                    $shareBtn.textContent = '开始屏幕共享';
                    $status.textContent = '接收端已加入，点击开始共享';
                    $status.className = 'status success';
                });

                $stopBtn.textContent = '退出房间';
                $status.textContent = '等待接收端扫码加入...';
                $status.className = 'status';
            } catch (err) {
                console.error(err);
                $status.className = 'status error';
                $status.textContent = err.message || '创建失败';
                setTimeout(cleanup, 5000);
            }
        };

        $shareBtn.onclick = async () => {
            $shareBtn.disabled = true;
            $shareBtn.textContent = '正在共享...';

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 2560, max: 3840 },
                        height: { ideal: 1440, max: 2160 },
                        frameRate: { ideal: 60, max: 60 }
                    },
                    audio: false
                });

                const videoTrack = stream.getVideoTracks()[0];
                setVideoTrackContentHints(stream, 'motion');
                manager.pc.addTrack(videoTrack, stream);
                setVideoCodecs(manager.pc, ['video/H264']);

                const offer = await manager.pc.createOffer();
                await manager.pc.setLocalDescription(offer);
                socket.emit('offer', offer);

                isSharing = true;
                $stopBtn.textContent = '停止共享';
                $shareBtn.textContent = '共享中';
                $status.textContent = '等待接收端连接...';
                $status.className = 'status';

                videoTrack.onended = () => {
                    stopSharing();
                };
            } catch (err) {
                console.error(err);
                $shareBtn.disabled = false;
                $shareBtn.textContent = '开始屏幕共享';
                $status.className = 'status error';
                $status.textContent = err.message || '共享启动失败';
            }
        };

        $stopBtn.onclick = () => {
            if (isSharing) {
                stopSharing();
            } else {
                cleanup();
            }
        };

        function stopSharing() {
            if (manager) {
                try { manager.pc.close(); } catch (_) {}
                manager = null;
            }
            manager = new WebRTCManager();
            manager.addEventListener('icecandidate', (e) => socket.emit('candidate', e.detail));
            manager.addEventListener('statechange', (e) => {
                const s = e.detail;
                if (s === 'failed') {
                    $status.textContent = '连接失败，请刷新重试';
                    $status.className = 'status error';
                }
            });

            isSharing = false;
            $stopBtn.textContent = '退出房间';
            $shareBtn.disabled = false;
            $shareBtn.className = 'btn-success';
            $shareBtn.textContent = '开始屏幕共享';
            $status.className = 'status';
            $status.textContent = '已停止共享，可重新开始';
        }

        function cleanup() {
            if (manager) {
                try { manager.pc.close(); } catch (_) {}
                manager = null;
            }
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            isSharing = false;
            $landing.classList.remove('hidden');
            $sharing.classList.add('hidden');
            $qrcode.innerHTML = '';
            $status.className = 'status';
            $status.textContent = '';
            $shareBtn.disabled = true;
            $shareBtn.className = 'btn-success';
            $shareBtn.textContent = '等待接收端加入...';
            $createBtn.disabled = false;
            $createBtn.textContent = '创建共享房间';
        }

        function setVideoTrackContentHints(stream, hint) {
            stream.getVideoTracks().forEach((track) => {
                if ('contentHint' in track) {
                    track.contentHint = hint;
                }
            });
        }

        function setVideoCodecs(pc, codecs) {
            const caps = RTCRtpSender.getCapabilities('video');
            if (!caps) return;
            const filtered = caps.codecs.filter(c => codecs.includes(c.mimeType));
            if (filtered.length === 0) return;
            pc.getTransceivers().forEach(t => t.setCodecPreferences(filtered));
        }
    </script>
</body>
</html>
