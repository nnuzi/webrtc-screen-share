name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: wss
  APP_PORT: "1443"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: docker build .

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar czf /tmp/wss-src.tar.gz \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./terraform' \
            --exclude='./.github' \
            --exclude='./.DS_Store' \
            --exclude='./dist' \
            --exclude='./build' \
            -C "${{ github.workspace }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: wss-src
          path: /tmp/wss-src.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wss-src
          path: /tmp

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          config: |
            Host ec2
              HostName ${{ secrets.EC2_HOST }}
              User ubuntu
              StrictHostKeyChecking no

      - name: Deploy to EC2
        run: |
          scp /tmp/wss-src.tar.gz ec2:/tmp/wss-src.tar.gz
          ssh ec2 'bash -s' <<'DEPLOY'
            set -e
            sudo rm -rf /opt/wss && sudo mkdir -p /opt/wss
            sudo tar xzf /tmp/wss-src.tar.gz -C /opt/wss
            cd /opt/wss
            sudo docker rm -f wss 2>/dev/null || true
            sudo docker build -t wss .
            sudo docker run -d --restart unless-stopped \
              -p 1443:1443 -e PORT=1443 \
              --name wss wss
            sudo docker rm -f cloudflared-tunnel 2>/dev/null || true
            sudo docker run -d --restart unless-stopped --network host \
              --name cloudflared-tunnel \
              cloudflare/cloudflared:latest tunnel --no-autoupdate \
              --url https://localhost:1443 --no-tls-verify
          DEPLOY

      - name: Get tunnel URL
        run: |
          sleep 10
          URL=$(ssh ec2 'sudo docker logs cloudflared-tunnel 2>&1' \
            | grep -oE 'https://[a-z0-9.-]+\.trycloudflare\.com' | head -1 || true)
          echo "### Deployment Info" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tunnel URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sender:  $URL/sender.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- Receiver: $URL/receiver.html?room=YOUR_ROOM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tunnel URL: $URL"
