name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ECR_REGISTRY: 298370269944.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_REPOSITORY: webrtc-screen-share
  ECR_IMAGE_TAG: ${{ github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: docker build .

  build-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - run: aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
      - run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$ECR_IMAGE_TAG .
      - run: docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$ECR_IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
      - run: docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: terraform
      - run: terraform apply -auto-approve -lock-timeout=60s
        working-directory: terraform
        env:
          TF_VAR_github_repo: nnuzi/webrtc-screen-share
          TF_VAR_github_token: ${{ secrets.TF_VAR_github_token }}
          TF_VAR_image_tag: ${{ github.sha }}
      - run: |
          echo "Waiting for service..."
          sleep 10
          for i in 1 2 3; do
            curl -sSk https://18.176.13.110/api/server-info && echo " Health check passed" && exit 0
            echo "Retry $i..."
            sleep 5
          done
          echo "Health check failed" && exit 1
